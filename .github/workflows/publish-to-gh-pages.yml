name: Publish Transcriptions to GitHub Pages

on:
  push:
    paths:
      - '**/transcriptions/*.json'
      - '.github/workflows/publish-to-gh-pages.yml'
      - 'scripts/generate-gh-pages-bundles.py'
      - 'scripts/generate-index-page.py'
  workflow_dispatch:  # Allow manual triggering

jobs:
  publish:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required to push to gh-pages branch
      pages: write     # Required for GitHub Pages
      id-token: write  # Required for OIDC authentication
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper git operations
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '10.24.1'
      
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt || true
          pip install beautifulsoup4 lxml || true
      
      - name: Install react-transcript-editor dependencies
        working-directory: ./react-transcript-editor
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      
      # Build browser-compatible UMD bundle for GitHub Pages
      # This creates a bundle that can be loaded directly in HTML via <script> tag
      # Note: We skip the component build (npm run build:component) as we only need the browser bundle
      - name: Build browser bundle for react-transcript-editor
        run: |
          cd react-transcript-editor
          npm install --save-dev webpack webpack-cli babel-loader @babel/core @babel/preset-env @babel/preset-react style-loader css-loader sass-loader node-sass || true
          node ../scripts/build-browser-bundle.js || echo "Browser bundle build skipped"
      
      - name: Generate bundles and index
        run: |
          python scripts/generate-gh-pages-bundles.py
          python scripts/generate-index-page.py
          echo "📊 Bundle directory size:"
          du -sh ./gh-pages-output || echo "Directory not found"
          echo ""
          echo "📁 Directory structure breakdown:"
          du -h --max-depth=2 ./gh-pages-output | sort -hr | head -20 || echo "Directory not found"
          echo ""
          echo "🔍 File type analysis:"
          echo "Audio files (.webm, .mp3, .opus):"
          find ./gh-pages-output -type f \( -name "*.webm" -o -name "*.mp3" -o -name "*.opus" \) -exec du -ch {} + | tail -1 || echo "No audio files found"
          echo "JSON files:"
          find ./gh-pages-output -type f -name "*.json" -exec du -ch {} + | tail -1 || echo "No JSON files found"
          echo "HTML files:"
          find ./gh-pages-output -type f -name "*.html" -exec du -ch {} + | tail -1 || echo "No HTML files found"
          echo "JavaScript files:"
          find ./gh-pages-output -type f -name "*.js" -exec du -ch {} + | tail -1 || echo "No JS files found"
          echo ""
          echo "📈 Largest files/directories:"
          find ./gh-pages-output -type f -exec du -h {} + | sort -rh | head -10 || echo "Directory not found"
          echo ""
          echo "📊 File counts:"
          echo "Total files: $(find ./gh-pages-output -type f 2>/dev/null | wc -l || echo 0)"
          echo "Audio files: $(find ./gh-pages-output -type f \( -name "*.webm" -o -name "*.mp3" -o -name "*.opus" \) 2>/dev/null | wc -l || echo 0)"
          echo "JSON files: $(find ./gh-pages-output -type f -name "*.json" 2>/dev/null | wc -l || echo 0)"
          echo "HTML files: $(find ./gh-pages-output -type f -name "*.html" 2>/dev/null | wc -l || echo 0)"
          echo ""
          echo "💾 Disk usage:"
          df -h
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './gh-pages-output'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

